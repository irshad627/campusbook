{% extends "base.html" %} <!--This is template inheretance-->

{% block title %}Login - CampusBook{% endblock %}<!--Overiding Parent Title-->

{% block content %}
    <h1>CampusBook Login</h1>

    {% if form.errors %}
        <p>Your username or password was incorrect. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
{% endblock %}
