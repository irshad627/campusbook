{% extends "base.html" %}

{% block title %}Delete {{ resource.name }} - CampusBook{% endblock %}

{% block content %}
    <h1>Delete resource</h1>
    <p>Are you sure you want to delete <strong>{{ resource.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'resource_list' %}">Cancel</a>
    </form>
{% endblock %}
