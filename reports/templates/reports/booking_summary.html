{% extends "base.html" %}

{% block title %}Booking summary - CampusBook{% endblock %}

{% block content %}
    <h1>Booking summary report</h1>

    <form method="get">
        <label for="start">From:</label>
        <input type="date" id="start" name="start" value="{{ start|date:'Y-m-d' }}">
        <label for="end">To:</label>
        <input type="date" id="end" name="end" value="{{ end|date:'Y-m-d' }}">
        <button type="submit">Run report</button>
    </form>

    <h2>{{ start|date:"Y-m-d" }} to {{ end|date:"Y-m-d" }}</h2>

    <table border="1" cellpadding="6">
        <tr>
            <th>Status</th>
            <th>Bookings</th>
        </tr>
        {% for label, count in rows %}
            <tr>
                <td>{{ label }}</td>
                <td>{{ count }}</td>
            </tr>
        {% endfor %}
        <tr>
            <td><strong>Total</strong></td>
            <td><strong>{{ total }}</strong></td>
        </tr>
    </table>
{% endblock %}
